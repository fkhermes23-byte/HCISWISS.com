name: Validate recurring public catalog

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: catalog-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    # Drafts allocate no runner. Confirm cost coverage before making a PR ready.
    # Fork code is not executed automatically by this internal validation path.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate catalog and negative controls
        run: |
          node --version
          node --check tests/public-catalog-consistency.test.mjs
          node tests/public-catalog-consistency.test.mjs
